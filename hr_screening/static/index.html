<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2454d6">
  <title>HR Скрининг</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div id="login-view" class="login-view">
    <main class="login-main" id="main">
      <div class="login-card">
        <span class="brand">HR Скрининг</span>
        <h1>Вход</h1>
        <form id="login-form" class="form-stack">
          <label for="username">Логин<input id="username" name="username" autocomplete="username" required maxlength="100"></label>
          <label for="password">Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="button primary login-submit" type="submit">Войти</button>
        </form>
        <details class="demo-access">
          <summary>Демо-доступ</summary>
          <div id="demo-users" class="demo-users">
            <button type="button" data-demo="recruiter">Рекрутер</button>
            <button type="button" data-demo="client">Заказчик</button>
            <button type="button" data-demo="admin">Администратор</button>
            <button type="button" data-demo="auditor">Аудитор</button>
          </div>
        </details>
      </div>
    </main>
  </div>
  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#tasks">HR Скрининг</a>
      <nav id="navigation" class="navigation" aria-label="Разделы"></nav>
      <div class="sidebar-bottom"><div class="profile"><div><strong id="profile-name"></strong><small id="profile-role"></small></div><button id="logout-button" class="icon-button" type="button" title="Выйти" aria-label="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4H5v16h4M14 8l4 4-4 4m-6-4h10"/></svg></button></div></div>
    </aside>
    <main id="workspace-main" class="workspace-main" tabindex="-1">
      <div class="page-heading"><h1 id="page-title">Задания</h1><div id="page-actions" class="page-actions"></div></div>
      <div id="view-content"></div>
    </main>
  </div>
  <dialog id="entry-dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" class="icon-button" aria-label="Закрыть">×</button></div><div id="dialog-content"></div></div></dialog>
  <dialog id="detail-drawer" class="detail-drawer" aria-labelledby="drawer-title"><div class="drawer-toolbar"><button type="button" class="button drawer-back" id="drawer-back" data-action="drawer-back" hidden>← Назад</button><h2 id="drawer-title" class="drawer-title-block" tabindex="-1"></h2><button type="button" class="icon-button" data-action="drawer-close" aria-label="Закрыть карточку">×</button></div><div id="drawer-mount" class="drawer-mount"></div></dialog>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
