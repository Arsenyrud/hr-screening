services:
  screening:
    build: .
    user: ${APP_UID:-1000}:${APP_GID:-1000}
    ports:
      - 127.0.0.1:8000:8000
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}
    environment:
      HR_DB: /app/runtime/hr.sqlite
      HR_DEVICE: cuda
      HR_MODEL_PATH: /app/models/semantic
      HR_LLM_PATH: /app/models/llm
      HR_WORKERS: 4
      HF_HOME: /tmp/hf
      TORCH_HOME: /tmp/torch
    volumes:
      - ./models:/app/models:ro
      - ./runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 16g
    pids_limit: 256
    networks:
      - isolated
networks:
  isolated:
    internal: true
